trigger:
  branches:
    include:
      - main

variables:
  acrLoginServer: 'myappregistry2001.azurecr.io'
  imageRepository: 'myapp'
  webAppName: 'mywebapp-cicd-2024'
  tag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: 'BUILD — Docker Image'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - checkout: self
      displayName: '📥 Checkout Code'

    - task: Docker@2
      displayName: '🔑 Login to ACR'
      inputs:
        command: login
        containerRegistry: 'ACR-ServiceConnection'

    - task: Docker@2
      displayName: '🔨 Build Docker Image'
      inputs:
        command: build
        repository: '$(acrLoginServer)/$(imageRepository)'
        dockerfile: 'Dockerfile'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: '📤 Push Image to ACR'
      inputs:
        command: push
        repository: '$(acrLoginServer)/$(imageRepository)'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: 'DEPLOY — App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: '🚀 Deploy to App Service'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: '$(webAppName)'
              containers: '$(acrLoginServer)/$(imageRepository):$(tag)'

          - script: |
              echo "⏳ Waiting 30s for app to start..."
              sleep 30
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                https://$(webAppName).azurewebsites.net/health)
              echo "Health check status: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ App is live and healthy!"
              else
                echo "❌ Health check failed: $STATUS"
                exit 1
              fi
            displayName: '🏥 Health Check'
